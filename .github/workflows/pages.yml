name: Sync main to gh-pages

# GitHub Pages는 gh-pages 브랜치에서 배포돼요.
# main에 push하면 gh-pages를 main과 똑같이 맞춰서 자동으로 다시 배포돼요.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
