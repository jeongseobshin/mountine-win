<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6f4a" />
  <title>100대 명산 완등 도장</title>
  <meta name="description" content="산림청 100대 명산 정상 인증 & 완등 도장" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="명산도장" />
  <link rel="icon" type="image/png" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-top">
      <h1>⛰️ 100대 명산 도장깨기</h1>
      <div class="top-actions">
        <button id="btnInstallTop" class="install-pill" hidden>📲 설치</button>
        <button id="btnMenu" class="icon-btn" aria-label="백업 및 설정">⚙️</button>
      </div>
    </div>

    <div class="player">
      <div class="ring" id="ring">
        <svg viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52" />
          <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52" />
        </svg>
        <div class="ring-text"><b id="doneCount">0</b><span>/100</span></div>
      </div>
      <div class="player-info">
        <div class="level-line"><span class="lv" id="lvNum">Lv.1</span> <span id="lvTitle">등린이</span></div>
        <div class="xpbar"><div class="xpfill" id="xpFill"></div></div>
        <div class="xptext" id="xpText">0 XP</div>
        <div class="stats">
          <div><b id="statHeight">0</b><span>누적 고도(m)</span></div>
          <div><b id="statBadges">0</b><span>배지</span></div>
          <div><b id="statYear">0</b><span>올해 완등</span></div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="badges-wrap">
      <h2>🏅 배지 <small id="badgeSummary"></small></h2>
      <div class="badges" id="badges"></div>
    </section>

    <section class="controls">
      <input id="search" type="search" placeholder="산 이름·지역 검색" autocomplete="off" />
      <div class="chips" id="statusChips">
        <button class="chip active" data-status="all">전체</button>
        <button class="chip" data-status="todo">미완등</button>
        <button class="chip" data-status="done">완등</button>
      </div>
      <select id="sort" aria-label="정렬">
        <option value="name">가나다순</option>
        <option value="high">높은 순</option>
        <option value="low">낮은 순</option>
        <option value="recent">최근 완등순</option>
      </select>
      <div class="chips scroll" id="regionChips"></div>
    </section>

    <section class="grid" id="grid"></section>
  </main>

  <footer class="foot">
    기록은 이 브라우저에만 저장돼요. ⚙️ 메뉴에서 꼭 백업해 두세요.
  </footer>

  <!-- 산 상세 / 인증 모달 -->
  <dialog id="dlg" class="sheet">
    <form method="dialog" class="sheet-inner" id="dlgForm">
      <button class="close" value="cancel" aria-label="닫기">✕</button>
      <div id="dlgBody"></div>
    </form>
  </dialog>

  <!-- 설정 모달 -->
  <dialog id="menu" class="sheet">
    <form method="dialog" class="sheet-inner">
      <button class="close" value="cancel" aria-label="닫기">✕</button>
      <h3>⚙️ 백업 · 설정</h3>
      <p class="muted">사진과 기록은 이 기기의 브라우저에 저장돼요. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 백업 파일을 내려받으세요.</p>
      <div class="menu-actions">
        <button type="button" class="btn" id="btnExport">📦 백업 파일 내려받기</button>
        <label class="btn ghost">📂 백업 파일 불러오기<input type="file" id="importFile" accept="application/json,.json" hidden /></label>
        <button type="button" class="btn danger" id="btnReset">🗑️ 모든 기록 초기화</button>
      </div>
      <p class="muted small" id="storageInfo"></p>

      <h3 id="iconSection" class="sub">🎨 앱 아이콘</h3>
      <div class="icon-current"><img id="iconPreview" src="icons/icon-192.png" alt="현재 아이콘"><span class="muted small">원하는 아이콘을 고르거나 내 사진으로 만들어요. 홈 화면에 설치할 때 이 아이콘이 쓰여요.<br>이미 설치했다면 앱을 지우고 다시 설치해야 바뀌어요.</span></div>
      <div class="icon-grid" id="iconPicker"></div>
      <div class="menu-actions">
        <button type="button" class="btn" id="btnInstall" hidden>📲 앱으로 설치하기</button>
      </div>
    </form>
  </dialog>

  <!-- 앱 설치 안내 -->
  <dialog id="installDlg" class="sheet">
    <div class="sheet-inner" id="installBody"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="js/mountains.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
